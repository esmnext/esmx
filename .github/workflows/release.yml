name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      dist-tag: ${{ steps.metadata.outputs.dist-tag }}
    permissions:
      contents: read
    steps:
      - name: Checkout immutable tag commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Require npm with Trusted Publishing support
        run: |
          npm install --global npm@11.16.0
          npm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify release identity
        run: node scripts/verify-release.mjs

      - name: Export release metadata
        id: metadata
        run: |
          version=$(node -p "require('./lerna.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist-tag=latest" >> "$GITHUB_OUTPUT"

      - name: Build packages
        run: |
          pnpm build:packages
          pnpm install --frozen-lockfile
          node scripts/prepare-release-artifacts.mjs
          node scripts/validate-release-artifacts.mjs

      - name: Type check
        run: pnpm lint:type

      - name: Unit tests
        run: pnpm test

      - name: Create immutable publish tarballs
        run: |
          node scripts/pack-release.mjs
          node scripts/verify-release-install.mjs

      - name: Upload publish tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-packages
          path: release-artifacts/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ needs.build.outputs.version }}
      DIST_TAG: ${{ needs.build.outputs.dist-tag }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Require npm with Trusted Publishing support
        run: npm install --global npm@11.16.0

      - name: Download verified publish tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-packages
          path: release-artifacts/

      - name: Publish missing packages via OIDC
        run: node scripts/publish-release.mjs

      - name: Verify all published versions
        run: |
          for attempt in 1 2 3 4 5; do
            node scripts/verify-published.mjs && exit 0
            sleep $((attempt * 5))
          done
          exit 1
